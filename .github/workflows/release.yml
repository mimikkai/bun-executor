# Package the extension as VSIX and publish a GitHub Release.
#
# Versioning: version is read from package.json. Every push to main produces a
# release even when package.json is unchanged — a build suffix is appended:
#   v0.0.1-main.160920261  (= -main.YYmmddHHMM, UTC)
# When a real version bump lands (package.json version changes), the plain
# v{version} tag is published instead.

name: Release VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Compute release version
        id: ver
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          STAMP=$(date -u +%y%m%d%H%M)
          # Marketplace allows up to 4 numeric components, each <= 2147483647.
          # Intermediate builds append a 4th numeric component (YYMMDDHH,
          # 8 digits). Stable builds use the plain package.json version.
          BUILD_STAMP=$(date -u +%y%m%d%H)
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "v${VERSION}"; then
            TAG="v${VERSION}-main.${STAMP}"
            PKG_VERSION="${VERSION}.${BUILD_STAMP}"
            VSIX_VERSION="${VERSION}-main.${STAMP}"
          else
            TAG="v${VERSION}"
            PKG_VERSION="${VERSION}"
            VSIX_VERSION="${VERSION}"
          fi
          echo "tag=${TAG}"        >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=${VSIX_VERSION}"       >> "$GITHUB_OUTPUT"
          echo "release: tag=${TAG} pkg=${PKG_VERSION} vsix=${VSIX_VERSION}"

      - name: Install deps & compile
        run: |
          bun install --no-save
          bunx tsc -p ./
      - name: Package VSIX
        env:
          PKG_VERSION: ${{ steps.ver.outputs.pkg_version }}
          VSIX_VERSION: ${{ steps.ver.outputs.vsix }}
        run: |
          # Marketplace requires a purely numeric version (1-4 dot-separated
          # numbers, each <= 2147483647). Stable builds use the plain
          # package.json version; intermediate builds append a 4th numeric
          # component (YYMMDDHH) computed in the version step.
          bun -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.PKG_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          bunx @vscode/vsce package --no-dependencies --allow-missing-repository -o "bun-executor-${VSIX_VERSION}.vsix"

      - name: Release notes
        run: |
          cat > release-notes.md <<EOF
          ## bun-executor ${{ steps.ver.outputs.tag }}

          - Source: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          - Commit: ${{ github.sha }}
          - Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "bun-executor ${{ steps.ver.outputs.tag }}" \
            --notes-file release-notes.md \
            "bun-executor-${{ steps.ver.outputs.vsix }}.vsix"